[project]
name = "taxi-lakehouse"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pyspark==3.5.3",
    "delta-spark==3.2.1",
    "pyyaml==6.0.2",
    "google-cloud-storage==2.18.2",
    "google-cloud-bigquery==3.26.0",
    "requests",
]

[dependency-groups]
dev = ["pytest==8.3.3"]

[tool.pytest.ini_options]
pythonpath = ["."]

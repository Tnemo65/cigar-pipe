name: CI Pipeline

permissions:
  contents: read

concurrency:
  group: lakehouse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: PySpark Tests & Schema Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.9.18"
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Install Databricks CLI for offline schema validation
        uses: databricks/setup-cli@v1.9.0
        with:
          version: 1.15.0

      - name: Validate all target schemas without credentials
        run: uv run python scripts/validate_bundle.py

      - name: Compile Python sources
        run: uv run python -m compileall -q src scripts tests

      - name: Run Pytest suite
        run: |
          mkdir -p artifacts
          uv run pytest tests/ -v --junitxml=artifacts/pytest.xml

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-evidence-${{ github.run_id }}
          path: artifacts/pytest.xml

      - name: Check working tree whitespace
        run: git diff --check

  validate-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - working-directory: infra
        run: |
          terraform fmt -check
          terraform init -backend=false
          terraform validate

# jobs/databricks.yml
bundle:
  name: nyc-taxi-lakehouse

sync:
  paths:
    - ../src
    - ../sql
    - ../configs

variables:
  catalog:
    default: taxi_lakehouse

resources:
  jobs:
    taxi_pipeline:
      name: taxi-pipeline

      environments:
        - environment_key: default
          spec:
            client: "1"
            dependencies:
              - google-cloud-bigquery
              - google-cloud-storage
              - pyyaml


      schedule:
        quartz_cron_expression: "0 0 6 1 * ?"
        timezone_id: "America/New_York"
        pause_status: PAUSED

      email_notifications:
        on_failure:
          - tnemo65.ldt@gmail.com
      notification_settings:
        no_alert_for_skipped_runs: true

      tasks:
        - task_key: ingest_bronze
          environment_key: default
          spark_python_task:
            python_file: ../src/ingestion/bronze_autoloader.py
          max_retries: 2
          timeout_seconds: 1800

        - task_key: transform_silver
          depends_on:
            - task_key: ingest_bronze
          environment_key: default
          spark_python_task:
            python_file: ../src/transform/silver_clean.py
          max_retries: 2
          timeout_seconds: 1800

        - task_key: dq_gate
          depends_on:
            - task_key: transform_silver
          environment_key: default
          spark_python_task:
            python_file: ../src/transform/run_dq_gate.py
          max_retries: 0
          timeout_seconds: 1800

        - task_key: aggregate_gold
          depends_on:
            - task_key: dq_gate
          environment_key: default
          spark_python_task:
            python_file: ../src/transform/run_gold_sql.py
          max_retries: 2
          timeout_seconds: 1800

        - task_key: export_bigquery
          depends_on:
            - task_key: aggregate_gold
          environment_key: default
          spark_python_task:
            python_file: ../src/export/export_bigquery.py
          max_retries: 2
          timeout_seconds: 1800

targets:
  dev:
    default: true

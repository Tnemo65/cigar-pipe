bundle:
  name: taxi-lakehouse

variables:
  gcp_project_id:
    description: GCP project ID
    default: ""
  month:
    description: Partition month to process (YYYY-MM)
    default: "2024-01"

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: ${workspace.host}

  prod:
    mode: production
    workspace:
      host: ${workspace.host}

resources:
  jobs:
    taxi_lakehouse_pipeline:
      name: taxi-lakehouse-pipeline-${bundle.target}
      tags:
        project: taxi-lakehouse
        env: ${bundle.target}

      # ── Cluster definitions ──────────────────────────────────────
      job_clusters:
        - job_cluster_key: etl_cluster
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            node_type_id: n2-standard-8
            num_workers: 4
            spark_conf:
              spark.databricks.delta.preview.enabled: "true"
              spark.sql.extensions: "io.delta.sql.DeltaSparkSessionExtension"
              spark.sql.catalog.spark_catalog: "org.apache.spark.sql.delta.catalog.DeltaCatalog"
            libraries:
              - maven:
                  coordinates: com.google.cloud.spark:spark-bigquery-with-dependencies_2.12:0.36.1

        - job_cluster_key: gold_cluster
          new_cluster:
            spark_version: "15.4.x-photon-scala2.12"   # Photon for Gold SQL aggregations
            node_type_id: n2-standard-8
            num_workers: 2
            spark_conf:
              spark.databricks.delta.preview.enabled: "true"
            libraries:
              - maven:
                  coordinates: com.google.cloud.spark:spark-bigquery-with-dependencies_2.12:0.36.1

      # ── Tasks ────────────────────────────────────────────────────
      tasks:
        - task_key: bronze_ingest
          job_cluster_key: etl_cluster
          python_wheel_task:
            package_name: taxi_lakehouse
            entry_point: bronze_ingest
            parameters:
              - "--month"
              - "${var.month}"

        - task_key: silver_clean
          depends_on:
            - task_key: bronze_ingest
          job_cluster_key: etl_cluster
          python_wheel_task:
            package_name: taxi_lakehouse
            entry_point: silver_clean
            parameters:
              - "--month"
              - "${var.month}"

        - task_key: dq_gate
          depends_on:
            - task_key: silver_clean
          job_cluster_key: etl_cluster
          python_wheel_task:
            package_name: taxi_lakehouse
            entry_point: dq_gate
            parameters:
              - "--month"
              - "${var.month}"

        - task_key: gold_marts
          depends_on:
            - task_key: dq_gate
          job_cluster_key: gold_cluster
          python_wheel_task:
            package_name: taxi_lakehouse
            entry_point: gold_marts
            parameters:
              - "--month"
              - "${var.month}"

        - task_key: export_bigquery
          depends_on:
            - task_key: gold_marts
          job_cluster_key: gold_cluster
          python_wheel_task:
            package_name: taxi_lakehouse
            entry_point: export_bq
            parameters:
              - "--month"
              - "${var.month}"

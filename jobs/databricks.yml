# jobs/databricks.yml
bundle:
  name: nyc-taxi-lakehouse

variables:
  catalog:
    default: taxi_lakehouse

resources:
  jobs:
    taxi_pipeline:
      name: taxi-pipeline

      job_clusters:
        - job_cluster_key: etl_cluster
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            node_type_id: "n2-standard-4"
            num_workers: 2
            data_security_mode: SINGLE_USER
        - job_cluster_key: gold_cluster
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            node_type_id: "n2-standard-4"
            num_workers: 2
            data_security_mode: SINGLE_USER
            runtime_engine: PHOTON

      tasks:
        - task_key: ingest_bronze
          job_cluster_key: etl_cluster
          spark_python_task:
            python_file: ../src/ingestion/bronze_autoloader.py
          max_retries: 2

        - task_key: transform_silver
          depends_on:
            - task_key: ingest_bronze
          job_cluster_key: etl_cluster
          spark_python_task:
            python_file: ../src/transform/silver_clean.py
          max_retries: 2

        - task_key: dq_gate
          depends_on:
            - task_key: transform_silver
          job_cluster_key: etl_cluster
          spark_python_task:
            python_file: ../src/transform/run_dq_gate.py
          max_retries: 0

        - task_key: aggregate_gold
          depends_on:
            - task_key: dq_gate
          job_cluster_key: gold_cluster
          spark_python_task:
            python_file: ../src/transform/run_gold_sql.py
          max_retries: 2

        - task_key: export_bigquery
          depends_on:
            - task_key: aggregate_gold
          job_cluster_key: etl_cluster
          spark_python_task:
            python_file: ../src/export/export_bigquery.py
          libraries:
            - maven:
                coordinates: "com.google.cloud.spark:spark-bigquery-with-dependencies_2.12:0.41.0"
          max_retries: 2

targets:
  dev:
    default: true
